name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[server,test]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end demo
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python -m tw_quant demo --output /tmp/tw-quant-demo

      - name: Validate Mock Replay API and WebSocket
        run: python -m unittest tests.test_live_api -v

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static dashboard
        env:
          NEXT_PUBLIC_MARKET_API_URL: http://localhost:8000
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build
