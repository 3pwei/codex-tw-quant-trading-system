name: Deploy to AWS Lightsail

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA from master; leave blank to deploy current master"
        required: false
        type: string
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: lightsail-production
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - id: revision
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha }}
        run: |
          sha="${REQUESTED_SHA:-$(git rev-parse HEAD)}"
          case "$sha" in
            *[!0-9a-f]*|'') echo "commit_sha must be a full lowercase hexadecimal SHA" >&2; exit 2 ;;
          esac
          test "${#sha}" -eq 40
          git merge-base --is-ancestor "$sha" HEAD
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install "uv==0.11.33"
          uv lock --check
          uv sync --locked --extra server --extra test --python python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - working-directory: dashboard
        run: npm ci
      - working-directory: dashboard
        run: npm run lint && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_MARKET_API_URL: ""

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: lightsail-production
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.LIGHTSAIL_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/lightsail
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/lightsail
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy approved revision
        env:
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ vars.LIGHTSAIL_USER }}
          DEPLOY_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          bundle="${RUNNER_TEMP}/tw-quant-${DEPLOY_SHA}.bundle"
          remote_bundle="/tmp/tw-quant-${DEPLOY_SHA}.bundle"
          git bundle create "${bundle}" HEAD
          git bundle verify "${bundle}"

          scp -i ~/.ssh/lightsail \
            -o BatchMode=yes \
            "${bundle}" \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}:${remote_bundle}"

          ssh -i ~/.ssh/lightsail \
            -o BatchMode=yes \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            "set -e; trap 'rm -f ${remote_bundle} /tmp/tw-quant-deploy.sh' EXIT; sudo git -C /opt/tw-quant/repo fetch '${remote_bundle}' HEAD; sudo git -C /opt/tw-quant/repo cat-file -e '${DEPLOY_SHA}^{commit}'; sudo git -C /opt/tw-quant/repo show '${DEPLOY_SHA}:deploy/lightsail/prepare-host.sh' | sudo bash; sudo git -C /opt/tw-quant/repo show '${DEPLOY_SHA}:deploy/lightsail/deploy.sh' > /tmp/tw-quant-deploy.sh; sudo bash /tmp/tw-quant-deploy.sh '${DEPLOY_SHA}'"

      - name: Verify public health endpoint
        env:
          PUBLIC_DASHBOARD_URL: ${{ vars.PUBLIC_DASHBOARD_URL }}
        run: |
          response="$(curl --fail --show-error --silent --location \
            --retry 8 --retry-delay 5 "${PUBLIC_DASHBOARD_URL%/}/healthz")"
          test "$response" = "ok"
