[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-quant-mvp"
version = "0.2.0"
description = "Taiwan intraday backtesting and TMF live market-data dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
shioaji = [
  "shioaji>=1.2,<2",
]
test = [
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["tw_quant*"]
