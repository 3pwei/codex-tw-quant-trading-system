[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-quant-mvp"
version = "0.1.0"
description = "Taiwan stock intraday backtesting MVP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
]

[tool.setuptools]
packages = ["tw_quant"]

